name: Daily Article Generation

on:
  schedule:
    # 毎日 9:00 JST (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate daily articles
        run: node scripts/gen-daily-articles.mjs

      - name: Generate daily report
        run: node scripts/gen-daily-report.mjs
        env:
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}

      - name: Build site
        run: npm run build

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tips/
          git diff --cached --quiet || git commit -m "chore: daily update $(date -u '+%Y-%m-%d')"
          git push
